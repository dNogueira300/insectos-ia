[project]
name = "insectos-ia"
version = "0.1.0"
description = "Identificación jerárquica de órdenes y familias de insectos amazónicos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pillow>=11.0",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "imagehash>=4.3",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]
# Filtro de contenido (pipeline/filtro_contenido.py). torch se instala con el
# índice de CPU: pip install torch --index-url https://download.pytorch.org/whl/cpu
filtro = ["torch>=2.5", "open_clip_torch>=3.0"]
modelo = ["torch>=2.5", "torchvision>=0.20", "timm>=1.0", "onnx>=1.17", "onnxruntime>=1.20", "matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explícito a propósito: la raíz tiene varios directorios (ontologia, bd,
# tests, docs) y la detección automática de setuptools falla con
# "Multiple top-level packages discovered in a flat-layout".
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
