# Clases candidatas a censar, ANTES de decidir cuáles entran al sistema.
#
# Este archivo no es la ontología del sistema: es la lista de lo que vale la
# pena consultar. La ontología real vive en clases.yaml y se congela en la
# Semana 3 con la tabla de disponibilidad delante.
#
# Estado: los 15 órdenes están completos. Sus taxon_id de iNaturalist y sus
# claves de GBIF se resolvieron contra las APIs el 2026-07-30 (coincidencia
# exacta en los 15 casos).
#
# LAS FAMILIAS ESTÁN PENDIENTES. Los órdenes de Insecta son un conjunto
# taxonómico cerrado y se pueden listar sin consultar a nadie; qué familias
# son de importancia económica para la Amazonía peruana es una decisión del
# entomólogo de la Facultad. Al recibir esa lista, añadir cada familia bajo su
# orden con el mismo formato y volver a correr el censo.
